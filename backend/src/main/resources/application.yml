server:
  port: 8080

spring:
  application:
    name: resume-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/resume?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: xxxxxx
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 简历系统自定义配置
resume:
  jwt:
    secret: ResumeSite-Jwt-Secret-2026!ChangeMe-0123456789abcdef
    # 过期时间（毫秒），默认 24 小时
    expire-ms: 86400000
